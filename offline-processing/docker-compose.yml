name: offline-processing

# The native pipeline (./ingest-and-sync) touches Docker only for the
# vision-server, which it brings up on demand (`docker compose up -d
# vision-server`). The gateway is only for ./model-server (turning this box into
# a model server for another machine). Ingest, tagging, and the label UI all run
# natively now — there is no `cli` container.
#
# Paths are relative to this file (offline-processing/).

services:
  # Python vision sidecar (faces + dogs). The pipeline reaches it on
  # localhost:8090; the host port is bound to 127.0.0.1 only, so it is NOT
  # exposed on the LAN. Remote access goes through the auth gateway below
  # (./model-server), never this port directly.
  vision-server:
    build:
      context: ./vision-server
    image: offline-processing-vision-server
    ports:
      - "127.0.0.1:${VISION_SERVER_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      VISION_SERVER_API_KEY: "${VISION_SERVER_API_KEY:-}"
      DET_SIZE: "${VISION_DET_SIZE:-640}"
      DOG_DET_CONF: "${VISION_DOG_DET_CONF:-0.5}"
      CONCURRENCY: "${VISION_CONCURRENCY:-4}"
    volumes:
      - insightface-cache:/root/.insightface
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  # Auth gateway for serving the model servers to another machine. Started only by
  # `./model-server` (profile-gated, so normal local runs never bring it up). It is
  # the ONLY port exposed on the LAN: a single bearer token (GATEWAY_TOKEN) fronts
  # both the native Ollama (tagging) and the vision-server (faces/dogs). See
  # Caddyfile for the routing.
  gateway:
    image: caddy:2-alpine
    profiles: ["server"]
    ports:
      - "${GATEWAY_PORT:-8443}:8443"
    environment:
      # Set by `./model-server` (it generates the token). Left empty otherwise — and
      # an empty token makes Caddy demand a literal "Bearer " on every route, so it
      # fails CLOSED. Don't use a mandatory (:?) guard here: compose interpolates
      # this service even for unrelated commands (e.g. a plain `up vision-server`),
      # which would then error out on a token they never needed.
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Reach the host's native Ollama (GPU) from inside the container. Automatic on
    # Docker Desktop (Mac/Win); host-gateway makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vision-server
    restart: unless-stopped

  # Tagging's vision LLM runs on a NATIVE Ollama on the host (GPU), not in Docker —
  # a CPU-only container is unusably slow for vision. ./model-server walks you
  # through installing it (https://ollama.com/download); the gateway reaches it
  # via host.docker.internal.

volumes:
  insightface-cache:
  hf-cache:
