# Offline Ingestion — tuning knobs (behaviour only; no secrets, no host/paths).
# Every key is optional: omit one to use its built-in default. Secrets live in
# .env.local; container paths and ports live in docker-compose.yml.

images:
  thumbnail:
    width: 300            # longest-edge px for the grid thumbnails
    quality: 85           # JPEG quality, 1-100
  full:
    maxDimension: null    # null = store originals untouched; a number caps the longest edge (px) and re-encodes
    quality: 90           # JPEG quality for re-encoded fulls, 1-100
  blurhash:
    componentsX: 4        # blurhash detail across, 1-9
    componentsY: 3        # blurhash detail down, 1-9

ingest:
  batchSize: 20           # images processed per parallel batch during scan/ingest

tagging:
  concurrency: 2000       # max in-flight vision-LLM requests (sliding window)
  # Prompt sent to the vision model for every image — this is what produces the search tags.
  prompt: |-
    Generate search tags for this image. Output 15-20 comma-separated tags covering:
    - Concrete subjects (people, objects, animals)
    - Setting/location (indoor/outdoor, specific place type)
    - Visual attributes (dominant colors, lighting, composition)
    - Style/medium (photo, illustration, screenshot, etc.)
    - Mood or activity
    Use lowercase, single words or short phrases. No explanations.

faces:
  detect:
    concurrency: 4        # parallel face-detection requests to the vision server
  cluster:                # DBSCAN over face embeddings (ArcFace, 512-d, cosine distance)
    eps: 0.45             # max distance to count as neighbours — lower = stricter, more groups
    minPts: 3             # min photos to form a group; below this they show as "ungrouped" singletons
    stickyAssignDist: 0.45  # max distance to auto-join a new face into an already-labeled group

dogs:
  detect:
    concurrency: 2        # parallel dog-detection requests
  cluster:                # DBSCAN over dog embeddings (DINOv2, 384-d) — tighter than faces (noisier embeddings)
    eps: 0.35
    minPts: 3
    stickyAssignDist: 0.35

labelApp:
  port: 5180              # tagging UI port -> http://localhost:<port>
  sampleFacesPerCluster: 9  # how many crop thumbnails to show on each group card

# Note: the Python vision-server's own knobs (detection size, dog confidence, its
# internal concurrency) are set via env in docker-compose.yml — VISION_DET_SIZE,
# VISION_DOG_DET_CONF, VISION_CONCURRENCY — not here.
